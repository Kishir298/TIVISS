name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt is intentionally stdlib-only; test tooling lives in
          # requirements-dev.txt so pytest is available before it is invoked.
          pip install -r requirements-dev.txt
      - name: Run lint
        run: |
          pip install ruff
          ruff check --select E9,F,I tiviss tests
      - name: Run tests
        run: |
          python -m pytest -q --tb=no
